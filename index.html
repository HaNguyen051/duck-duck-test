<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Ao Vịt</title>
  <meta name="description" content="Trang tìm kiếm với ao vịt tương tác: kéo lá sen, chạm nước để tạo sóng.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2379baff'/%3E%3Cellipse cx='18' cy='19' rx='9' ry='6' fill='%23fff'/%3E%3Ccircle cx='11' cy='12' r='5' fill='%23fff'/%3E%3Cpath d='M6 12l-4 1.5L6 15z' fill='%23f59e0b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="pond" id="pond" role="img" aria-label="Ao sen tràn màn hình với hai chú vịt trắng, lá sen trôi chậm từ trái sang phải">
    <!-- Ảnh tĩnh: hiện ngay, và là bản dự phòng khi không có WebGL / mở bằng file://.
         Bỏ các lá gốc bị cắt mép (1, 3, 4, 7) vì ao rộng hơn ảnh gốc sẽ lộ vết cắt. -->
    <div class="pond-static" aria-hidden="true">
      <img class="water-t" src="images-duck/00_nuoc_sach.png" alt="" decoding="async">
      <img class="water-l" src="images-duck/00_nuoc_sach.png" alt="" decoding="async">
      <img class="water-0" src="images-duck/00_nuoc_sach.png" alt="" decoding="async">
      <img class="water-r" src="images-duck/00_nuoc_sach.png" alt="" decoding="async">
      <img src="images-duck/01_song_nuoc.png" alt="" decoding="async">
      <img src="images-duck/02_la_sen_2.png" alt="" decoding="async">
      <img src="images-duck/02_la_sen_5.png" alt="" decoding="async">
      <img src="images-duck/02_la_sen_6.png" alt="" decoding="async">
      <img src="images-duck/03_vit_1.png" alt="" decoding="async">
      <img src="images-duck/03_vit_2.png" alt="" decoding="async">
      <img src="images-duck/04_chan_vit_1_ngoai.png" alt="" decoding="async">
      <img src="images-duck/04_chan_vit_1_trong.png" alt="" decoding="async">
      <img src="images-duck/04_chan_vit_2_ngoai.png" alt="" decoding="async">
      <img src="images-duck/04_chan_vit_2_trong.png" alt="" decoding="async">
      <img src="images-duck/05_giot_nuoc.png" alt="" decoding="async">
    </div>
    <canvas class="pond-gl" id="pond-gl" aria-hidden="true"></canvas>
  </div>

  <main class="panel">
    <h1 class="wordmark">Ao Vịt</h1>

    <form class="search" role="search" action="https://www.google.com/search" method="get">
      <label class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
        <input type="search" name="q" id="q" autocomplete="off" autofocus enterkeyhint="search" aria-label="Tìm kiếm" placeholder="Tìm kiếm">
        <kbd class="search-key" aria-hidden="true">/</kbd>
      </label>
      <div class="search-actions">
        <button type="submit">Tìm với Google</button>
        <button type="submit" name="tbm" value="isch">Tìm hình ảnh</button>
      </div>
    </form>

    <p class="file-note" id="file-note" hidden>
      Bạn đang mở thẳng file nên ao vịt chỉ hiện ảnh tĩnh.
      Muốn kéo lá và tạo sóng, chạy <code>npx serve .</code> trong thư mục dự án
      rồi mở <a href="http://localhost:3000">http://localhost:3000</a>.
    </p>
  </main>

  <p class="hint" id="hint">Kéo lá sen · chạm hoặc vuốt mặt nước để tạo sóng</p>

  <script>
    // Mở bằng file:// thì trình duyệt chặn ES module và việc đọc pixel ảnh → chỉ hiện ảnh tĩnh, không nạp module.
    if (location.protocol === 'file:') {
      document.body.classList.add('nogl');
      document.getElementById('file-note').hidden = false;
    } else {
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'js/main.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
