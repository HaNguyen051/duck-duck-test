<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Ao Vịt</title>
  <meta name="description" content="Ao sen tương tác nhìn từ dưới mặt nước: kéo vịt, kéo lá sen, chạm nước để tạo sóng.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231d4e86'/%3E%3Cellipse cx='18' cy='19' rx='9' ry='6' fill='%23dfe8e6'/%3E%3Ccircle cx='11' cy='12' r='5' fill='%23fff'/%3E%3Cpath d='M6 12l-4 1.5L6 15z' fill='%23f87a18'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="pond" id="pond" role="img" aria-label="Ao sen nhìn từ dưới mặt nước: hai chú vịt bơi phía trên, lá sen trôi chậm">
    <canvas class="pond-gl" id="pond-gl" aria-hidden="true"></canvas>
  </div>

  <p class="file-note" id="file-note" hidden>
    Bạn đang mở thẳng file nên trình duyệt chặn ES module và việc đọc ảnh.
    Chạy <code>npx serve .</code> trong thư mục dự án rồi mở
    <a href="http://localhost:3000">http://localhost:3000</a>.
  </p>

  <script>
    // Mở bằng file:// thì trình duyệt chặn ES module, fetch manifest và đọc pixel ảnh → chỉ báo lỗi.
    if (location.protocol === 'file:') {
      document.body.classList.add('nogl');
      document.getElementById('file-note').hidden = false;
    } else {
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'js/main.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
